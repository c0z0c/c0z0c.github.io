<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>c0z0c - 경력</title>
    <link rel="stylesheet" href="assets/common.css">
    <style>
        /* 약력 페이지 전체 영역 */
        .page-wrap {
            max-width: 900px;
            margin: 0 auto;
            padding: 3.8rem 1.5rem 2.5rem;
        }

        /* 약력 페이지 제목과 설명 */
        .page-title {
            font-size: clamp(1.4rem, 4vw, 2rem);
            color: var(--accent-green);
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.4);
            margin-bottom: 0.3rem;
        }

        .page-sub {
            font-size: 1.0rem;
            color: var(--text-dim);
            margin-bottom: 1.4rem;
            line-height: 1.5;
        }

        /* 약력 본문의 경력 섹션 */
        section {
            margin-bottom: 1.8rem;
        }

        section h2 {
            font-size: 1.0rem;
            color: var(--accent-blue-text);
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border-dim);
            padding-bottom: 0.35rem;
            margin-bottom: 0.9rem;
        }

        /* 약력 본문의 개별 경력 항목: 기간과 상세 내용 */
        .entry {
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 1rem;
            margin-bottom: 1.3rem;
        }

        .entry-period {
            font-size: 0.95rem;
            color: var(--accent-cyan);
        }

        /* 경력 상세의 직무명, 소속, 수행 내용 */
        .entry-body .entry-role {
            font-size: 1.18rem;
            color: #eee;
        }

        .entry-body .entry-org {
            font-size: 1.02rem;
            color: var(--text-dim);
            margin-top: 0.15rem;
        }

        .entry-body ul {
            margin-top: 0.5rem;
            padding-left: 1.1rem;
        }

        .entry-body li {
            font-size: 1.02rem;
            color: var(--text-dim);
            line-height: 1.6;
        }

        /* 보유 기술 목록 */
        .skills-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .skill-pill {
            font-size: 0.98rem;
            color: var(--accent-cyan);
            border: 1px solid var(--border-dim);
            border-radius: 999px;
            padding: 0.25rem 0.75rem;
        }

        /* 인증 배지 목록: 배지가 늘어나면 가로로 나열 */
        .badge-list {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }

        @media (min-width: 1500px) {
            .page-wrap {
                max-width: 1040px;
            }
        }

        @media (max-width: 640px) {
            .entry {
                grid-template-columns: 1fr;
                gap: 0.3rem;
            }
        }
    </style>
