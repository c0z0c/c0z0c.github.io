<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI c0z0c</title>
    <link rel="stylesheet" href="assets/common.css">
    <style>
        /* AI c0z0c 화면 전체 영역 */
        .page-wrap {
            max-width: 900px;
            margin: 0 auto;
            padding: 3rem 1.5rem 1.5rem;
        }

        /* AI c0z0c 페이지 제목과 부제목 */
        .page-title {
            font-size: clamp(1.4rem, 4vw, 2rem);
            color: var(--accent-green);
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.4);
            margin-bottom: 0.15rem;
        }

        .page-sub {
            font-size: 1.15rem;
            color: var(--text-dim);
            margin-bottom: 0.8rem;
        }

        /* 사용자 입력과 AI 응답을 표시하는 대화 본문 */
        .chat-window {
            border: 1px solid var(--border-dim);
            border-radius: 8px;
            background: rgba(10, 10, 10, 0.5);
            padding: 0.75rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
        }

        /* 대화 본문 내부의 사용자/AI/오류 메시지 */
        .bubble {
            max-width: 80%;
            padding: 0.45rem 0.85rem;
            border-radius: 8px;
            font-size: 1.1rem;
            line-height: 1.45;
        }

        .bubble.user {
            align-self: flex-end;
            background: rgba(181, 3, 252, 0.12);
            border: 1px solid rgba(181, 3, 252, 0.4);
            color: #ddd;
        }

        .bubble.bot {
            align-self: flex-start;
            background: rgba(0, 255, 65, 0.08);
            border: 1px solid rgba(0, 255, 65, 0.35);
            color: #cdefd8;
        }

        .bubble.error {
            align-self: center;
            background: rgba(255, 68, 68, 0.08);
            border: 1px solid rgba(255, 68, 68, 0.4);
            color: #ffb3b3;
        }

        /* 추천 질문, 입력창, 저장 상태, 초기화 버튼 등 대화 조작 UI */
        .chat-suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.45rem;
            margin-top: 0.6rem;
        }

        .chip {
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--accent-cyan);
            background: none;
            border: 1px solid var(--border-dim);
            border-radius: 999px;
            padding: 0.25rem 0.75rem;
            cursor: pointer;
        }

        .chip:hover {
            border-color: var(--accent-cyan);
            background: rgba(0, 255, 255, 0.08);
        }

        .chat-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 0.35rem;
        }

        .chat-toolbar .storage-note {
            font-size: 0.9rem;
            color: var(--text-dimmer);
        }

        .chat-clear-btn {
            font-size: 0.9rem;
            color: var(--text-dim);
            background: none;
            border: 1px solid var(--border-dim);
            border-radius: 4px;
            padding: 0.2rem 0.55rem;
            cursor: pointer;
            font-family: inherit;
        }

        .chat-clear-btn:hover {
            color: var(--accent-red);
            border-color: var(--accent-red);
        }

        .chat-form {
            display: flex;
            gap: 0.6rem;
            margin-top: 0.6rem;
        }

        .chat-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-dim);
            border-radius: 6px;
            padding: 0.5rem 0.8rem;
            color: #eee;
            font-family: inherit;
            font-size: 1.1rem;
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--accent-green);
        }

        .chat-send-btn {
            background: rgba(0, 255, 65, 0.1);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            border-radius: 6px;
            padding: 0.5rem 1.1rem;
            font-family: inherit;
            font-size: 1.05rem;
            cursor: pointer;
        }

        .chat-send-btn:hover {
            background: rgba(0, 255, 65, 0.2);
        }

        .chat-send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 큰 화면에서 챗 영역이 위쪽에 몰리지 않도록 최소 높이 확보 */
        @media (min-width: 1500px) {
            .page-wrap {
                max-width: 1600px;
                padding: 2.2rem 1.5rem 1.2rem;
                display: grid;
                grid-template-columns: minmax(0, 1fr) 22rem;
                column-gap: 2rem;
                align-content: start;
            }

            .page-wrap > .page-title,
            .page-wrap > .page-sub {
                grid-column: 1 / -1;
            }

            .page-wrap > .chat-toolbar,
            .page-wrap > .chat-window,
            .page-wrap > .chat-form,
            .page-wrap > .chat-suggestions {
                grid-column: 1;
            }

            .page-wrap .cards {
                grid-column: 2;
                grid-row: 3 / span 4;
                margin-top: 0;
                display: flex;
                flex-direction: column;
                align-self: start;
            }

            .chat-window {
                min-height: 18vh;
            }
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.2rem;
            margin-top: 2.5rem;
        }

        .info-card {
            border: 1px solid var(--border-dim);
            border-radius: 8px;
            padding: 1.2rem;
            background: rgba(10, 10, 10, 0.4);
        }

        .info-card h3 {
            font-size: 1.15rem;
            color: var(--accent-cyan);
            margin-bottom: 0.4rem;
        }

        .info-card a {
            color: var(--accent-cyan);
        }

        .info-card p {
            font-size: 0.95rem;
            color: var(--text-dim);
            line-height: 1.5;
        }
    </style>
    <meta name="description" content="22년 임베디드·시스템 엔지니어링 위에 LLM·RAG·에이전트·n8n 자동화를 더하는 AI/SW 엔지니어 김명환(c0z0c)의 포트폴리오">
    <meta property="og:type" content="website">
    <meta property="og:title" content="AI c0z0c">
    <meta property="og:description" content="22년 임베디드·시스템 엔지니어링 위에 LLM·RAG·에이전트·n8n 자동화를 더하는 AI/SW 엔지니어 김명환(c0z0c)의 포트폴리오">
    <meta property="og:image" content="https://c0z0c.github.io/assets/og-image.png">
    <meta property="og:url" content="https://c0z0c.github.io/AIc0z0c.html">
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
</head>

<body>
    <button class="debug-toggle" onclick="toggleDebug()">DEBUG OFF</button>
    <div class="debug-line-vertical" id="debugVertical"></div>
    <div class="debug-line-horizontal" id="debugHorizontal"></div>
    <div class="terminal-cursor"></div>
    <div class="matrix-bg" id="matrixBg"></div>

    <button class="nav-toggle" onclick="toggleNav()" aria-label="메뉴">☰</button>
    <!-- 공통 내비게이션 -->
    <nav class="nav-links">
        <div class="nav-item"><a href="index.html" class="nav-link">Home</a></div>
        <div class="nav-item"><a href="AIc0z0c.html" class="nav-link active">AI c0z0c</a></div>
        <div class="nav-item"><a href="career.html" class="nav-link">경력</a></div>
        <div class="nav-item"><a href="portfolio.html" class="nav-link">포트폴리오</a></div>
        <div class="nav-item"><a href="https://c0z0c.github.io/blog" class="nav-link">Blog</a></div>
    </nav>

    <!-- AIc0z0c 본문: 채팅 UI와 추천 질문을 배치한다. -->
    <div class="page-wrap">
        <h1 class="page-title">AI c0z0c</h1>
        <p class="page-sub">c0z0c의 이력을 근거로 답하는 AI 페르소나입니다. <span id="chatModeNote"></span></p>

        <div class="chat-toolbar">
            <span class="storage-note">💾 대화 기록은 이 브라우저의 local storage에 저장되고, 질문은 답변 생성을 위해 백엔드(POST /chat)로 전송됩니다</span>
            <button class="chat-clear-btn" id="chatClearBtn" type="button">대화 초기화</button>
        </div>

        <!-- 대화 표시 영역: aichat.js가 사용자·AI 메시지를 추가한다. -->
        <div class="chat-window" id="chatWindow"></div>

        <form class="chat-form" id="chatForm">
            <input type="text" class="chat-input" id="chatInput" placeholder="c0z0c에게 물어보세요... (예: helper-hwp는 뭐하는 패키지예요?)" autocomplete="off" maxlength="2000">
            <button type="submit" class="chat-send-btn" id="chatSendBtn">전송</button>
        </form>
        <!-- 추천 질문 영역: aichat.js가 질문 chip을 생성한다. -->
        <div class="chat-suggestions" id="chatSuggestions"></div>

        <div class="cards">
            <div class="info-card">
                <h3>기반 데이터</h3>
                <p>경력기술서, 포트폴리오 프로젝트</p>
            </div>
            <div class="info-card">
                <h3>답변 방식</h3>
                <p>이력 기반 답변 생성</p>
            </div>
            <div class="info-card">
                <h3>문의</h3>
                <p>자세한 논의는 c0z0c@hotmail.com 으로 연락해 주세요</p>
            </div>
        </div>
    </div>

    <!-- common.js는 공통 UI, aichat-api.js는 API 경계, aichat.js는 채팅 상태를 담당한다. -->
    <script src="assets/common.js"></script>
    <script src="assets/aichat-api.js"></script>
    <script src="assets/aichat.js"></script>
</body>

</html>
