<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>c0z0c - Portfolio</title>
    <link rel="stylesheet" href="assets/common.css">
    <style>
        /* 포트폴리오 페이지 전체 영역 */
        .page-wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 3.8rem 1.5rem 2.5rem;
        }

        /* 포트폴리오 페이지 제목과 설명 */
        .page-title {
            font-size: clamp(1.4rem, 4vw, 2rem);
            color: var(--accent-green);
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.4);
            margin-bottom: 0.3rem;
        }

        .page-sub {
            font-size: 1.15rem;
            color: var(--text-dim);
            margin-bottom: 1.4rem;
            line-height: 1.5;
        }

        /* 포트폴리오 본문의 프로젝트 카드 배치 */
        #portfolioGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.4rem;
        }

        /* portfolio.js가 생성하는 개별 프로젝트 카드 */
        #portfolioGrid .proj-card {
            width: auto;
        }

        /* FHD 이상: 카드 수가 늘어도 마지막 줄이 한 장만 남지 않도록 넉넉한 4열 기준 */
        @media (min-width: 1500px) {
            .page-wrap {
                max-width: 1700px;
            }

            #portfolioGrid {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
            }

            #portfolioGrid .proj-card {
                flex: 0 0 calc((100% - 3 * 1.4rem) / 4);
            }
        }
    </style>
    <meta name="description" content="22년 임베디드·시스템 엔지니어링 위에 LLM·RAG·에이전트·n8n 자동화를 더하는 AI/SW 엔지니어 김명환(c0z0c)의 포트폴리오">
    <meta property="og:type" content="website">
    <meta property="og:title" content="c0z0c - Portfolio">
    <meta property="og:description" content="22년 임베디드·시스템 엔지니어링 위에 LLM·RAG·에이전트·n8n 자동화를 더하는 AI/SW 엔지니어 김명환(c0z0c)의 포트폴리오">
    <meta property="og:image" content="https://c0z0c.github.io/assets/og-image.png">
    <meta property="og:url" content="https://c0z0c.github.io/portfolio.html">
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
</head>

    <!-- 전체 포트폴리오 본문: portfolio.js가 manifest.json 전체를 카드로 렌더링한다. -->
    <div class="page-wrap">
        <h1 class="page-title">Portfolio</h1>
        <p class="page-sub">
            AI 에이전트, RAG, 업무 자동화, 서비스 운영, 오픈소스까지 직접 만든 프로젝트 모음입니다.
            카드를 누르면 저장소, 시연 자료 또는 서비스 페이지로 이동합니다.
        </p>
        <div id="portfolioGrid"></div>
    </div>

    <!-- 공통 UI를 초기화한 뒤 portfolio.js가 프로젝트 카드를 표시한다. -->
